name: Post Minecraft videos

on:
  schedule:
    - cron: "30 7,16 * * *"   # roz 1:00 PM aur 9:30 PM IST
  workflow_dispatch:          # manual test ke liye

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run video poster
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: node post_videos.js

      - name: Save posted list
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add posted_videos.json
          git diff --staged --quiet || (git commit -m "Update posted videos" && git push)
