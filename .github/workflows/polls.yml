name: Post daily poll

on:
  schedule:
    - cron: "30 12 * * *"   # roz 6:00 PM IST
  workflow_dispatch:        # manual test ke liye

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run poll poster
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node post_poll.js

      - name: Save poll state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add poll_state.json
          git diff --staged --quiet || (git commit -m "Update poll state" && git push)
