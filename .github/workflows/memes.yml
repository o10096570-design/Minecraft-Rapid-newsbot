name: Post Minecraft memes

on:
  schedule:
    - cron: "30 4,14 * * *"   # roz 10:00 AM aur 8:00 PM IST
  workflow_dispatch:           # manual test ke liye

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run meme poster
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: node post_memes.js

      - name: Save posted list
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add posted.json
          git diff --staged --quiet || (git commit -m "Update posted memes" && git push)
